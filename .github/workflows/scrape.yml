name: "Daily scrape"

on:
  workflow_dispatch:
  schedule:
  - cron: "0 19 * * *"

permissions:
  contents: read

concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip==26.2.1
        pip install -r requirements.txt
    # Only the last two months of posts, not the whole dataset; see hub.py.
    - name: Fetch recent posts from Hugging Face
      run: python hub.py fetch
    - name: Scrape new posts
      run: python scrape.py
    - name: Upload new posts to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: python hub.py upload
    # This job does not use dataset-sync's publish, so it pings the dead man's switch itself.
    - uses: fferegrino/dataset-sync/ping@v1
      with:
        url: ${{ secrets.HEALTHCHECK_URL }}
    - uses: fferegrino/dataset-sync/ping@v1
      if: failure()
      with:
        url: ${{ secrets.HEALTHCHECK_URL }}
        status: fail
